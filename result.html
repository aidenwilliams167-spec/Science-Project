   <script>
function confetti() {
    for (let i = 0; i < 100; i++) {
        let piece = document.createElement("div");

        piece.style.position = "fixed";
        piece.style.width = "10px";
        piece.style.height = "10px";
        piece.style.backgroundColor =
            ["pink", "yellow", "blue", "green", "purple", "orange"][Math.floor(Math.random() * 6)];

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.top = "-10px";
        piece.style.zIndex = "9999";

        document.body.appendChild(piece);

        let fall = piece.animate(
            [
                { transform: "translateY(0) rotate(0deg)" },
                { transform: "translateY(100vh) rotate(720deg)" }
            ],
            {
                duration: 2000 + Math.random() * 2000,
                easing: "ease-out"
            }
        );

        fall.onfinish = () => piece.remove();
    }
}
</script>

   <button onclick="confetti()" style="position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; font-size: 16px;">This took forever!</button>
 </body>
